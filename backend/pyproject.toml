[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "langgraph>=0.2,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<20",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]
full-training = [
  "catboost>=1.2,<2",
  "lightgbm>=4.5,<5",
  "xgboost>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
worldcup-rebuild = "worldcup_agent.cli.rebuild:main"
worldcup-simulate = "worldcup_agent.cli.simulate:main"
worldcup-generate-portfolio = "worldcup_agent.cli.generate_portfolio:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
